name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit:coverage
      - run: npm run test:scheduled-mutations
      - run: npm run build
        env:
          BLOG_SCHEDULE_NOW: "2026-10-07T17:00:00.000Z"
      - run: npm run test:scheduled-leak
      - run: npm run test:e2e -- tests/e2e/scheduled-blog-hydration.spec.ts
        env:
          PW_PRODUCTION_SERVER: "true"
          BLOG_SCHEDULE_NOW: "2026-10-07T17:00:00.000Z"
      - run: npm run test:e2e -- --grep-invert "Performance readiness web-vitals smoke"
      - run: npm run test:e2e:perf
        env:
          PW_PRODUCTION_SERVER: "true"
      - run: npm run build
        env:
          BLOG_SCHEDULE_NOW: "2026-11-10T08:00:00.000Z"
      - run: npm run test:scheduled-rollout

  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e:devices
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-test-evidence
          path: test-results/devices
          retention-days: 7
